name: micrm16s
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python>=3.11          # tomllib
  - numpy>=2
  - scipy>=1.14           # HiGHS linprog, BDF
  - matplotlib
  - r-base=4.5
  - bioconductor-dada2=1.38
  - gapseq=2.1
  - glpk                  # gapseq fill -z glpk
  - barrnap=0.9           # brings hmmer (nhmmer)
  - mash=2.3
  - ncbi-datasets-cli=18.36
