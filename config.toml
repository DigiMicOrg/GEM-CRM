# MiCRM 16S workflow configuration. Relative paths are resolved against this folder.

[paths]
raw_data  = "16data"     # input: one FASTQ (or R1/R2 pair, R1 used) per community
databases = "databases"  # auto-downloaded SILVA + Madin trait table
genomes   = "genomes"    # NCBI taxonomy answers, genome downloads, 16S copies, selections
gems      = "gems"       # gapseq models (one folder per genome accession) + U/L pair cache
results   = "results"    # per-community outputs, figures, summary.csv

[compute]
threads = 4               # total CPU threads to use
parallel_denoise = 2      # communities denoised at once
parallel_gems = 2         # GEMs built at once (threads are split between them)
parallel_communities = 4  # MiCRM parameterisation/simulations at once

[denoise]
silva_url = "https://zenodo.org/records/14169026/files/silva_nr99_v138.2_toGenus_trainset.fa.gz?download=1"
silva_trainset = ""       # optional local path; empty = download into databases/
max_trunc_len = 230       # truncLen = min(modal read length, this)
trim_left = 0
min_reads_after_filter = 200

[genomes]
max_candidates = 10       # genomes compared per genus (16S Mash) before picking one
family_fallback = true    # use another genus of the same family when the genus has no genome
ncbi_api_key = ""         # optional; or set the NCBI_API_KEY environment variable

[gems]
gapseq_db = ""            # optional custom gapseq sequence DB (-D); empty = gapseq default
update_gapseq_sequences = true
timeout_hours = 12        # per gapseq stage

[parameters]
madin_url = "https://raw.githubusercontent.com/bacteria-archaea-traits/bacteria-archaea-traits/master/output/condensed_species_NCBI.csv"
madin_traits = ""         # optional local path; empty = download into databases/
missing_m_policy = "sample"   # "sample" (seeded random volume in observed range) or "max"
carbon_sinks = ["cpd00011", "cpd00242"]  # CO2, HCO3-: never treated as resources
min_genera = 2

[micrm]
initial_total = 0.0001    # R0 total, split uniformly over resources
feed_total = 5.0          # supply rho total, split uniformly over resources
biomass = 1.0             # C0 of every consumer
turnover = 0.1
t_end = 300000.0
